plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.75'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

sourceSets.main.resources { srcDirs 'src/main/resources', 'src/generated/resources' }
repositories { mavenCentral() }

dependencies {
    implementation 'org.lz4:lz4-java:1.8.0'
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    var replaceProperties = [
            minecraft_version: project.minecraft_version,
            neoforge_version: project.neoforge_version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }